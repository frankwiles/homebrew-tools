name: Update dic Formula

on:
  workflow_dispatch:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dic:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch latest release from dic repo
        id: get-latest
        run: |
          LATEST_TAG=$(curl -fsS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/frankwiles/dic/releases/latest" | jq -r '.tag_name')
          LATEST_VERSION="${LATEST_TAG#v}"
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "ERROR: Failed to fetch latest release tag"
            exit 1
          fi
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check current version in formula
        id: check-current
        run: |
          CURRENT_VERSION=$(grep -m1 'releases/download/v' Formula/dic.rb | sed 's|.*releases/download/v\([^/]*\)/.*|\1|')
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download binaries and calculate checksums
        if: steps.get-latest.outputs.version != steps.check-current.outputs.current
        id: checksums
        run: |
          TAG="${{ steps.get-latest.outputs.tag }}"

          curl -fLsS "https://github.com/frankwiles/dic/releases/download/${TAG}/dic-macos-aarch64" -o /tmp/dic-aarch64
          ARM_SHA=$(shasum -a 256 /tmp/dic-aarch64 | awk '{print $1}')

          curl -fLsS "https://github.com/frankwiles/dic/releases/download/${TAG}/dic-macos-x86_64" -o /tmp/dic-x86_64
          INTEL_SHA=$(shasum -a 256 /tmp/dic-x86_64 | awk '{print $1}')

          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$INTEL_SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        if: steps.get-latest.outputs.version != steps.check-current.outputs.current
        env:
          TAG: ${{ steps.get-latest.outputs.tag }}
          ARM_SHA: ${{ steps.checksums.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.checksums.outputs.intel_sha }}
        run: |
          cat > Formula/dic.rb << 'EOF'
          # typed: false
          # frozen_string_literal: true

          class Dic < Formula
            desc "Remove local Docker images using simple text matching"
            homepage "https://github.com/frankwiles/dic"
            license "BSD-3-Clause"
            depends_on :macos

            if Hardware::CPU.intel?
              url "https://github.com/frankwiles/dic/releases/download/${TAG}/dic-macos-x86_64"
              sha256 "${INTEL_SHA}"

              def install
                bin.install "dic-macos-x86_64" => "dic"
              end
            end

            if Hardware::CPU.arm?
              url "https://github.com/frankwiles/dic/releases/download/${TAG}/dic-macos-aarch64"
              sha256 "${ARM_SHA}"

              def install
                bin.install "dic-macos-aarch64" => "dic"
              end
            end

            test do
              system bin/"dic", "--version"
            end
          end
          EOF

          envsubst < Formula/dic.rb > /tmp/dic.rb
          mv /tmp/dic.rb Formula/dic.rb

      - name: Create Pull Request
        if: steps.get-latest.outputs.version != steps.check-current.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Update dic to v${{ steps.get-latest.outputs.version }}"
          body: |
            Automated update for dic v${{ steps.get-latest.outputs.version }}
          committer: GitHub <noreply@github.com>
          branch: "update-dic-${{ steps.get-latest.outputs.version }}"
          delete-branch: true
